  <circle cx="185" cy="152" r="4.5" fill="#f2b632" stroke="#8a5a00" stroke-width="1.5"/>

  <!-- hair, front: centre parting, curtains over the forehead edges -->
  <path d="M120 30 C88 30 62 50 56 84 C52 110 52 150 44 196 L36 196 C40 150 36 100 48 70 C60 40 88 24 120 24 Z" fill="#b8915c" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
