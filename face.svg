  <rect x="104" y="180" width="32" height="30" rx="10" fill="#efc2a6"/>

  <!-- face -->
  <ellipse cx="120" cy="124" rx="62" ry="72" fill="#f6d2bb" stroke="#111" stroke-width="3"/>

  <!-- ears + gold earring (her left, our right) -->
