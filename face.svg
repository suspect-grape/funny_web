<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- background -->
  <rect width="240" height="240" fill="#ffd400"/>
  <circle cx="120" cy="120" r="120" fill="#ffe45c"/>

  <!-- hair, back layer -->
