  <path d="M120 26 C96 30 72 46 60 84 C70 62 92 48 118 46 Z" fill="#c9a46c" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <path d="M120 26 C144 30 168 46 180 84 C170 62 148 48 122 46 Z" fill="#c9a46c" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <!-- highlights -->
  <path d="M74 60 C82 50 94 44 106 42" fill="none" stroke="#e2c48e" stroke-width="4" stroke-linecap="round"/>
  <path d="M48 110 C46 140 46 165 42 186" fill="none" stroke="#d6b47c" stroke-width="3" stroke-linecap="round"/>
  <path d="M192 110 C194 140 194 165 198 186" fill="none" stroke="#d6b47c" stroke-width="3" stroke-linecap="round"/>

  <!-- eyebrows: one cheekily raised -->
  <path d="M78 92 C88 84 102 84 110 90" fill="none" stroke="#7a5a36" stroke-width="5" stroke-linecap="round"/>
  <path d="M132 86 C140 76 156 76 166 84" fill="none" stroke="#7a5a36" stroke-width="5" stroke-linecap="round"/>

  <!-- eyes: smug half-lidded, blue-grey -->
  <ellipse cx="95" cy="110" rx="14" ry="9" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <ellipse cx="148" cy="108" rx="14" ry="10" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="97" cy="112" r="6.5" fill="#5f7f9c"/><circle cx="97" cy="112" r="3" fill="#111"/>
  <circle cx="150" cy="110" r="6.5" fill="#5f7f9c"/><circle cx="150" cy="110" r="3" fill="#111"/>
  <circle cx="99" cy="110" r="1.6" fill="#fff"/><circle cx="152" cy="108" r="1.6" fill="#fff"/>
  <!-- heavy lids -->
  <path d="M80 108 C86 100 104 100 110 106 L110 101 C102 96 86 96 80 104 Z" fill="#e9b89c" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M133 105 C140 98 158 98 163 104 L163 99 C156 93 140 93 133 101 Z" fill="#e9b89c" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- nose -->
  <path d="M121 112 C118 128 112 138 116 144 C120 148 128 147 131 143" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="84" cy="146" rx="13" ry="8" fill="#f2a0a0" opacity=".55"/>
  <ellipse cx="160" cy="146" rx="13" ry="8" fill="#f2a0a0" opacity=".55"/>

  <!-- lopsided smug smirk -->
  <path d="M96 164 C110 174 134 174 152 158" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M150 154 C154 156 156 160 155 164" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M94 160 C95 163 97 165 99 166" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
